[app]
title = "Wage regression playground"
subtitle = "Synthetic data, 200 workers"

[data]
file = "data.csv"
id = "id"

[source]
name = "Synthetic wage data"
citation = "Generated by example/make_example.py (seed 20261023)"
license = "CC0"
url = ""
note = "Not real data. For practice only."

[variables.wage]
label = "Hourly wage"
unit = "dollars"
type = "float"

[variables.lwage]
label = "Log hourly wage"
logged = true
type = "float"

[variables.educ]
label = "Years of education"
unit = "years"
type = "int"

[variables.exper]
label = "Years of experience"
unit = "years"
type = "int"

[variables.female]
label = "Female"
type = "bool"

[variables.region]
label = "Region"
type = "int"

[variables.sector]
label = "Sector"
type = "category"

[variables.urban]
label = "Urban"
type = "int"

[samples]
all = { label = "All workers" }
urban = { label = "Urban only", where = "urban == 1" }

[defaults]
y = "lwage"
models = ["educ", "educ + exper + sq(exper)"]
samples = ["all"]
cov_type = "HC1"
