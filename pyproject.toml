[project]
name = "regression-playground"
version = "0.1.0"
description = "Shinylive app for building OLS models on a phone"
requires-python = "==3.12.*"
dependencies = [
    "shiny",
    "shinylive==0.8.12",
    "pandas==2.2.3",
    "patsy==0.5.6",
    "numpy==2.0.2",
    "scipy==1.14.1",
    "statsmodels==0.14.4",
    "stargazer==0.0.7",
]

[dependency-groups]
dev = [
    "pytest",
    "pyarrow",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
